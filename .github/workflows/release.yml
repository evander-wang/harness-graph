name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Verify release tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagVersion = process.env.TAG_VERSION.replace(/^v/u, '');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/u.test(tagVersion)) {
            throw new Error(`Tag 必须是 vX.Y.Z：${process.env.TAG_VERSION}`);
          }
          if (packageJson.version !== tagVersion || packageLock.version !== tagVersion || packageLock.packages?.['']?.version !== tagVersion) {
            throw new Error(`Tag ${tagVersion} 与 package.json/package-lock.json 版本不一致。`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run project checks
        run: npm run check:all

      - name: Run project check
        run: npm run project:check

      - name: Publish with npm provenance
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
